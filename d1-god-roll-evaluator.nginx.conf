# /etc/nginx/sites-available/d1-god-roll-evaluator
#
# Terminates TLS for krypnos.net and reverse-proxies all traffic
# to the Node.js Express server on port 3000.

server {
    listen 443 ssl;
    server_name krypnos.net;

    ssl_certificate     /etc/ssl/d1-god-roll/krypnos.net.crt;
    ssl_certificate_key /etc/ssl/d1-god-roll/krypnos.net.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Proxy everything to the Node.js Express server
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Needed for session cookies to work through the proxy
        proxy_set_header   Cookie            $http_cookie;
        proxy_pass_header  Set-Cookie;

        # /api/inventory can take a while — generous timeout
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}

server {
    listen 80;
    server_name krypnos.net;
    return 301 https://$host$request_uri;
}
