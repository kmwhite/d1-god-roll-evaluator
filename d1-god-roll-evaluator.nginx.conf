# /etc/nginx/sites-available/d1-god-roll-evaluator
#
# Terminates TLS for krypnos.net (self-signed cert) and reverse-proxies
# the Bungie OAuth callback to the Node.js auth server on port 7777.
#
# Install:
#   sudo cp d1-god-roll-evaluator.nginx.conf /etc/nginx/sites-available/d1-god-roll-evaluator
#   sudo ln -s /etc/nginx/sites-available/d1-god-roll-evaluator \
#              /etc/nginx/sites-enabled/d1-god-roll-evaluator
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 443 ssl;
    server_name krypnos.net;

    # --- TLS (self-signed) ---------------------------------------------------
    ssl_certificate     /etc/ssl/d1-god-roll/krypnos.net.crt;
    ssl_certificate_key /etc/ssl/d1-god-roll/krypnos.net.key;

    # Modern TLS only — nothing older than 1.2
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # --- OAuth callback → Node.js --------------------------------------------
    # Bungie redirects here after the user approves the app.
    # Node's http.createServer() is listening on 127.0.0.1:7777.
    location /callback {
        proxy_pass         http://127.0.0.1:7777/callback;
        proxy_http_version 1.1;

        # Forward the real host so Node can construct correct URLs if needed
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Auth exchange is fast; keep timeouts tight
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # --- Catch-all: return 200 for everything else ---------------------------
    # Bungie may do a HEAD/GET on the root to validate the redirect origin.
    location / {
        return 200 'D1 God Roll Evaluator auth endpoint';
        add_header Content-Type text/plain;
    }
}

# Redirect plain HTTP → HTTPS so nothing breaks if Bungie ever tries port 80
server {
    listen 80;
    server_name krypnos.net;
    return 301 https://$host$request_uri;
}
